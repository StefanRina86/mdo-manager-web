btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{color:var(--red)}.field{border:1px solid #cbd5e0;border-radius:7px;padding:9px 10px;background:white;color:var(--text);min-width:0}.toolbar input{width:300px;max-width:100%}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;background:white;text-align:left}th,td{padding:11px 12px;border-bottom:1px solid #edf1f5;white-space:nowrap}th{font-size:12px;color:#5d7084;background:#f9fbfd}tr:last-child td{border-bottom:0}tr:hover td{background:#f8fafc}.tag{display:inline-block;padding:3px 9px;font-size:11px;border-radius:30px;font-weight:800;background:#eaf0f7;color:#456}.tag.ESER{background:#dff5e9;color:#126a48}.tag.FUES{background:#fff0df;color:#985000}.tag.OFF{background:#ffe2e7;color:#a71d30}.tag.SOPP{background:#e4e7eb;color:#596271}.tag.DA_VERIFICARE{background:#edf0f6;color:#425d82}.click{color:#0676b4;background:none;border:0;padding:0;font-weight:700;text-align:left}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid label{display:flex;flex-direction:column;gap:5px;font-weight:650;font-size:12px}.formgrid input,.formgrid select,.formgrid textarea{width:100%}.full{grid-column:1/-1}.note{border-left:4px solid #6a92b0;background:#edf5fc;padding:10px 13px;border-radius:5px;margin-bottom:18px}.warn{border-left-color:#e0a94b;background:#fff8e8}.bad{border-left-color:#bb3348;background:#fff0f1}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:15px}.stack{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:9px;padding:12px}.small{font-size:12px}.pill{padding:2px 7px;border:1px solid var(--line);border-radius:6px;font-size:12px}.empty{padding:35px;text-align:center;color:var(--muted)}.dialog-bg{position:fixed;inset:0;background:#071b2aaa;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}.dialog{background:white;max-width:850px;width:100%;max-height:90vh;overflow:auto;border-radius:14px;padding:22px;box-shadow:0 12px 50px #0015}.dialog h2{margin-right:32px}.close{float:right;border:none;background:none;font-size:25px;line-height:1}.mobile-menu{display:none}.status-led{width:9px;height:9px;border-radius:100%;background:var(--yellow);display:inline-block;margin-right:4px}@media(max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}.side{width:190px}.grid2{grid-template-columns:1fr}}@media(max-width:700px){.side{display:none;position:fixed;z-index:15;top:0;left:0;width:250px}.side.open{display:block}.mobile-menu{display:inline-block}.top{padding:12px 14px}.top h1{font-size:17px}.content{padding:13px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{padding:12px}.kpi .num{font-size:24px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:13px}.toolbar .grow{flex-basis:100%}.toolbar input{width:100%}}

</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><div class="app" style="display:none"><aside class="side" id="sidebar"><div class="brand"><span class="brand-mark">M</span><div>MDO Manager<div class="subbrand">UM TE1 · Gallarate</div></div></div><nav id="nav"></nav><div class="foot">Versione 2.17 TEST · Supabase<br>Non sostituisce le verifiche RFI</div></aside><div class="main"><header class="top"><div style="display:flex;align-items:center;gap:10px"><button class="btn mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><h1 id="title">Dashboard</h1></div><span class="muted small">● Sincronizzato con Supabase</span></header><main class="content" id="view"></main></div></div><div id="modal"></div><script>
const SEED=[];
const SAP_ORDINI_SEED=[];
const KEY='mdo_manager_v1';
const initial={mezzi:SEED,cantieri:[],controlli:[],guasti:[],imprese:[],config:{alertDays:30},version:1};
let db=structuredClone(initial); // Nessun dato locale prima dell'autenticazione
if(!Array.isArray(db.sapOrdini))db.sapOrdini=[];const ordiniVisti=new Set(db.sapOrdini.map(x=>String(x.ordine)));for(const ordine of SAP_ORDINI_SEED){if(!ordiniVisti.has(String(ordine.ordine))){db.sapOrdini.push(ordine);ordiniVisti.add(String(ordine.ordine));}}
for(const k of ['mezzi','cantieri','controlli','guasti','imprese'])if(!Array.isArray(db[k]))db[k]=[];
for(const m of db.mezzi){const u=SEED.find(q=>q.id===m.id);if(u){if(!m.tecnica||!Object.keys(m.tecnica).length)m.tecnica=u.tecnica;if(!m.carta_file)m.carta_file=u.carta_file;m.carta=!!m.carta_file;m.verifiche_dati=u.verifiche_dati;if(!m.massa_sap_origine)m.massa_sap_origine=u.massa_sap_origine;if(m.massa===''||m.massa==null)m.massa=u.massa;}}

let current='dashboard', selected=null;
const sections=[['dashboard','▦ Dashboard'],['mezzi','▤ Parco MdO'],['tecnica','▧ Schede tecniche'],['scadenze','◷ Scadenze'],['sapordini','▤ Ordini SAP'],['controlli','✓ Controlli'],['guasti','⚠ Guasti / Officina'],['cantieri','▥ Cantieri'],['calcoli','▣ Verifiche convogli'],['studio217','◈ Studio itinerario 2.17'],['imprese','◇ Imprese'],['amministrazione','⚙ Amministrazione']];
function save(){try{/* Cache locale disabilitata nella versione pubblica */return true}catch(e){alert('Impossibile salvare nel browser: esporta un backup JSON.');return false}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(d){if(!d)return '—';let p=d.split('-');return p.length===3?p.reverse().join('/'):esc(d)}
function days(d){return Math.ceil((new Date(d+'T12:00:00')-new Date())/86400000)}
function tag(x){return '<span class="tag '+esc(x)+'">'+esc(x)+'</span>'}
function btn(s,action=''){return '<button class="btn" '+action+'>'+s+'</button>'}
function show(tab){current=tab;selected=null;document.getElementById('sidebar').classList.remove('open');render()}
function render(){document.getElementById('nav').innerHTML=sections.map(([k,v])=>'<button class="nav '+(k===current?'active':'')+'" onclick="show(\''+k+'\')">'+v+'</button>').join('');document.getElementById('title').textContent=sections.find(i=>i[0]===current)?.[1].split(' ').slice(1).join(' ')||current;document.getElementById('view').innerHTML=({dashboard:dashboard,mezzi:parco,tecnica:tecnica,scadenze:scadenze,sapordini:sapordini,controlli:controlli,guasti:guasti,cantieri:cantieri,calcoli:calcoli,studio217:studio217,imprese:imprese,amministrazione:admin}[current])();if(current==='mezzi')filterMezzi();}
function mdo217InitIframe(){const frame=document.getElementById('mdo217frame');if(!frame)return;try{const list=db.mezzi.filter(m=>m.stato!=='SOPP'&&!m.archiviato).map(m=>{const t=m.tecnica||{};const values=['velocita_isolato_kmh','velocita_trazione_attiva_kmh','velocita_composizione_kmh','velocita_trainato_kmh'].map(k=>Number(t[k])).filter(n=>Number.isFinite(n)&&n>0);return {id:String(m.id||''),name:String(m.descrizione||m.nome||m.id||'MdO'),speed:values.length?Math.min(...values):null}});frame.contentWindow.mdo217SetVehicles(list,(window.compDraft?.ids||[]))}catch(e){console.warn('Modulo Studio 2.17 non raggiungibile:',e)}}
function studio217(){return '<div class="panel"><div class="note warn">Studio itinerario 2.17 in collaudo: valori FL non ancora convalidati e nessuna autorizzazione operativa.</div><iframe id="mdo217frame" onload="mdo217InitIframe()" src="studio-itinerario-217.html" title="Studio itinerario MdO 2.17" style="width:100%;height:85vh;min-height:740px;border:1px solid #dce4ed;border-radius:10px;background:white"></iframe></div>'}\nfunction kpi(n,t){return '<div class="kpi"><div class="num">'+n+'</div><div class="tiny">'+t+'</div></div>'}
function tabella(head,rows){return '<div class="tablewrap"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function dashboard(){let m=db.mezzi;let n=x=>m.filter(a=>a.stato===x).length;let open=db.guasti.filter(x=>x.stato!=='CHIUSO').length;let upcoming=db.controlli.filter(x=>x.prossima&&days(x.prossima)<=db.config.alertDays).sort((a,b)=>a.prossima.localeCompare(b.prossima));return '<div class="note">Archivio SAP incrociato con 21 carte di circolazione e 84 ODL dall’export 15/10/2026. Gli stati vengono gestiti come ESER, FUES, OFF e SOPP. Una data di ultima verifica <b>non è una data di scadenza</b> finché non viene specificata la periodicità.</div><section class="kpis">'+kpi(m.length,'Mezzi censiti')+kpi(n('ESER'),'In esercizio · ESER')+kpi(n('FUES'),'Fuori esercizio · FUES')+kpi(n('OFF'),'In officina · OFF')+kpi(n('SOPP'),'Soppressi · SOPP')+'</section><div class="grid2"><div class="panel"><h2>Scadenze da presidiare</h2><div class="muted small">'+(upcoming.length?'Scadenze inserite e calcolate da piani confermati':'Non ci sono ancora scadenze con periodicità confermata.')+'</div><div class="stack" style="margin-top:12px">'+(upcoming.slice(0,8).map(x=>'<div class="item"><b>'+esc(x.tipo)+'</b> · '+esc(x.mezzo)+'<div class="small">'+fmtDate(x.prossima)+' · '+(days(x.prossima)<0?'Scaduta':days(x.prossima)+' giorni')+'</div></div>').join('')||'<div class="empty">Aggiungi il piano controlli dal modulo Scadenze.</div>')+'</div></div><div class="panel"><h2>Attività e anomalie</h2><p><b>'+open+'</b> anomalie aperte</p><p><b>'+db.cantieri.length+'</b> cantieri censiti</p><p><b>'+m.filter(x=>!x.carta).length+'</b> schede senza carta nello ZIP ricevuto</p><p class="muted small">L’assenza della carta dallo ZIP non ne dimostra l’assenza sul mezzo.</p><div class="actions"><button class="btn primary" onclick="show(\'mezzi\')">Apri il parco MdO</button></div></div></div>'}
function tecnica(){let m=db.mezzi;let cols=['Equipment','Mezzo','Tara (t)','Carico max (t)','Massa frenata vuoto (t)','Massa frenata carico (t)','Assi','V. traino (km/h)','Fonte'];return '<div class="note">Dati riportati nelle carte di circolazione. Le caratteristiche mancanti sono indicate con — e richiedono verifica documentale. Non utilizzare la tabella per autorizzare circolazione o frenatura.</div>'+tabella(cols,m.map(x=>{let t=x.tecnica||{};const v=k=>(t[k]===undefined||t[k]===null?'—':esc(t[k]));return '<tr><td>'+esc(x.id)+'</td><td>'+esc(x.nome)+'</td><td>'+v('massa_vuoto_t')+'</td><td>'+v('carico_massimo_t')+'</td><td>'+v('massa_frenata_vuoto_t')+'</td><td>'+v('massa_frenata_carico_t')+'</td><td>'+v('numero_assi')+'</td><td>'+v('velocita_composizione_kmh')+'</td><td>'+ (x.carta_file?'Carta ZIP':'Da integrare')+'</td></tr>';}));}
function schedaTecnica(x){let t=x.tecnica||{},entries=Object.entries(t),flags=x.verifiche_dati||[];return '<div class="full" style="padding:14px;border:1px solid #dce4ed;border-radius:10px;background:#f7fafc"><h3>Caratteristiche tecniche da carta di circolazione</h3><p class="muted small">Fonte: '+esc(x.carta_file||'Carta individuale non presente nello ZIP')+'. Dati originali SAP conservati separatamente. Verificare sempre documenti e loro aggiornamenti.</p>'+(entries.length?'<div class="formgrid">'+entries.map(([k,v])=>'<label><span class="muted small">'+esc(k.replaceAll('_',' '))+'</span><input class="field" disabled value="'+esc(v)+'"></label>').join('')+'</div>':'<p class="muted">Nessun valore disponibile da carta PDF individuale.</p>')+(flags.length?'<div class="note warn">'+flags.map(esc).join('; ')+'</div>':'')+'</div>'}
function parco(){return '<div class="toolbar"><input class="field grow" placeholder="Cerca equipment, matricola, descrizione..." id="q" oninput="filterMezzi()"><select class="field" id="statefilter" onchange="filterMezzi()"><option value="">Tutti gli stati</option>'+['ESER','FUES','OFF','SOPP','DA_VERIFICARE'].map(x=>'<option>'+x+'</option>').join('')+'</select><button class="btn primary" onclick="editMezzo()">+ Nuovo mezzo</button></div><div id="mtable"></div>'}
function filterMezzi(){let q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('statefilter').value;let m=db.mezzi.filter(x=>(!s||x.stato===s)&&(x.id+' '+x.nome+' '+x.libretto+' '+x.impresa).toLowerCase().includes(q));document.getElementById('mtable').innerHTML=tabella(['Equipment','Descrizione','Stato','Libretto','Massa a vuoto (t)','Carta ZIP',''],m.map(x=>'<tr><td><button class="click" onclick="editMezzo(\''+esc(x.id)+'\')">'+esc(x.id)+'</button></td><td>'+esc(x.nome)+'</td><td>'+tag(x.stato)+'</td><td>'+esc(x.libretto||'—')+'</td><td>'+esc(x.massa??'—')+'</td><td>'+(x.carta?'Sì':'—')+'</td><td><button class="click" onclick="editMezzo(\''+esc(x.id)+'\')">Apri →</button></td></tr>'))}
function modal(content){document.getElementById('modal').innerHTML='<div class="dialog-bg" onclick="if(event.target===this)closeModal()"><div class="dialog"><button class="close" aria-label="Chiudi" onclick="closeModal()">×</button>'+content+'</div></div>'}
function closeModal(){document.getElementById('modal').innerHTML=''}
function editMezzo(id){let x=db.mezzi.find(m=>m.id===id)||{id:'',nome:'',stato:'DA_VERIFICARE',proprieta:'RFI',impresa:'',sede:'',ubicazione:'',libretto:'',massa:'',potenza:'',causa:'',note:'',carta:false,verifiche:{}};let isNew=!id;modal('<h2>'+(isNew?'Nuovo MdO':'Scheda MdO · '+esc(id))+'</h2><form id="mezzof" class="formgrid" onsubmit="saveMezzo(event, '+(isNew?'true':'false')+')"><label>Equipment / ID *<input class="field" required name="id" value="'+esc(x.id)+'" '+(isNew?'':'readonly')+'></label><label>Descrizione *<input class="field" required name="nome" value="'+esc(x.nome)+'"></label><label>Stato operativo<select class="field" name="stato">'+['ESER','FUES','OFF','SOPP','DA_VERIFICARE'].map(s=>'<option '+(s===x.stato?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label>Proprietà<select class="field" name="proprieta"><option '+(x.proprieta==='RFI'?'selected':'')+'>RFI</option><option '+(x.proprieta==='IMPRESA'?'selected':'')+'>IMPRESA</option></select></label><label>Impresa / Gestore<input class="field" name="impresa" value="'+esc(x.impresa)+'"></label><label>Sede / Nucleo<input class="field" name="sede" value="'+esc(x.sede)+'"></label><label>Ubicazione<input class="field" name="ubicazione" value="'+esc(x.ubicazione)+'"></label><label>Codice libretto<input class="field" name="libretto" value="'+esc(x.libretto)+'"></label><label>Massa a vuoto (t; vedi scheda tecnica)<input type="number" step="any" min="0" class="field" name="massa" value="'+esc(x.massa)+'"></label><label>Potenza SAP (kW)<input type="number" step="any" min="0" class="field" name="potenza" value="'+esc(x.potenza)+'"></label><label class="full">Motivo FUES / OFF e prescrizioni<input class="field" name="causa" value="'+esc(x.causa)+'"></label><label class="full">Note<textarea rows="3" class="field" name="note">'+esc(x.note)+'</textarea></label><div class="full small muted">Carta di circolazione presente nell’archivio ZIP: '+(x.carta?'Sì':'non individuata')+'. Le date SAP riportate in origine sono conservate nel censimento di partenza.</div>'+schedaTecnica(x)+'<div class="full actions"><button type="button" class="btn" onclick="closeModal()">Annulla</button><button class="btn primary">Salva scheda</button></div></form>')}
function saveMezzo(ev,isNew){ev.preventDefault();let v=Object.fromEntries(new FormData(ev.target).entries());let old=db.mezzi.find(x=>x.id===v.id);if(isNew&&old){alert('Equipment già presente');return}if(v.stato==='ESER'&&old&&old.stato!=='ESER'&&!confirm('Confermi il passaggio a ESER? La verifica operativa e le autorizzazioni di competenza restano a carico del personale abilitato.'))return;let out={...(old||{}),...v,massa:v.massa===''?'':Number(v.massa),potenza:v.potenza===''?'':Number(v.potenza),dataAggiornamento:new Date().toISOString()};if(old)Object.assign(old,out);else db.mezzi.push(out);save();closeModal();render()}

/* Piani ricavati dai documenti: nessuna scadenza è certificata senza verifica del libretto/verbale. */
const SAP_DATES=[];
const MUM_PLANS=[
 {match:'S 45',title:'SAEM S45 / autoscala S45',periods:[200,400,500,4000],source:'MUM-S45_rev.01e.pdf, manutenzione, pagg. 69-79 e sez. 3',notes:'Verificare sul piano quale operazione corrisponde alla soglia e se prevale il limite temporale.'},
 {match:'F 93',title:'FIPEM F93 S4',periods:[400,500],source:'MUM-FIPEM_F93S4_file alleggerito.pdf, sezioni 3-4',notes:'Sono presenti anche attività semestrali e controlli annuali: verificare singola scheda.'},
 {match:'RIMORCHIO',title:'Rimorchio SAEM',periods:[],source:'MUM SAEM rimorchio.pdf, piano e schede manutenzione annuale e quinquennale',notes:'Controlli a calendario; l’ultima visita deve essere verificata.'},
 {match:'OCPD001',title:'TESMEC OCPD001',periods:[],source:'MUM OCPD001.pdf, pag. 12, richiama piano di manutenzione TESMEC cod. 071220',notes:'Non presumere il calendario dal solo manuale d’uso: verificare il piano separato.'}
];
function addYears(iso,n){if(!iso)return '';const a=iso.split('-').map(Number);if(a.length!==3)return '';const d=new Date(Date.UTC(a[0]+n,a[1]-1,a[2]));return d.toISOString().slice(0,10)}
function mumFor(m){let v=m.nome.toUpperCase();return MUM_PLANS.find(p=>v.includes(p.match))}
function provisionalSchedule(){return SAP_DATES.map(row=>{let m=db.mezzi.find(x=>x.id===row.id);if(!m)return null;let q=row.quinquennale;return {m,ultima:q,ipotesi:addYears(q,5),attrezzatura:row.sollevamento,plan:mumFor(m)}}).filter(Boolean)}
function hoursUpdate(id){let m=db.mezzi.find(x=>x.id===String(id));if(!m)return;let raw=prompt('Ore di funzionamento TOTALI riportate sul contaore del mezzo '+id+' (lascia vuoto per non modificare)',m.oreLavoro??'');if(raw===null||raw.trim()==='')return;let n=Number(raw.replace(',','.'));if(!Number.isFinite(n)||n<0){alert('Valore non valido');return;}m.oreLavoro=n;save();render()}
function suggestedChecks(){let v=provisionalSchedule(),q=v.filter(x=>x.ultima);let orders=q.map(x=>'<tr><td>'+esc(x.m.id)+'</td><td>'+esc(x.m.nome)+'</td><td>'+fmtDate(x.ultima)+'</td><td>'+fmtDate(x.ipotesi)+'</td><td><strong>DA RISCONTRARE</strong><div class="muted small">Proiezione quinquennale dalla data SAP; non prova scadenza né regolarità</div></td></tr>');let h=v.filter(x=>x.plan);let rows=h.map(x=>'<tr><td>'+esc(x.m.id)+'</td><td>'+esc(x.plan.title)+'</td><td>'+esc(x.plan.periods.length?x.plan.periods.map(y=>y+' h').join(' / '):'Verifiche da piano / calendario')+'</td><td>'+(x.m.oreLavoro===undefined?'Non inserito':esc(x.m.oreLavoro)+' h')+'</td><td><button class="btn" onclick="hoursUpdate('+esc(x.m.id)+')">Contaore</button></td><td class="small">'+esc(x.plan.source)+'<div class="muted">'+esc(x.plan.notes)+'</div></td></tr>');return '<div class="panel"><h3>Proiezioni quinquennali da SAP · '+q.length+' mezzi con data</h3><div class="note warn">La data ipotizzata è ottenuta aggiungendo 5 anni all’ultima verifica quinquennale VISIBILE in SAP. Non è una scadenza ufficiale accertata: possono esistere verifiche successive non riportate. L’esito non determina automaticamente FUES/ESER.</div>'+tabella(['Equipment','Mezzo','Ultima data SAP','Data ipotetica + 5 anni','Validazione'],orders)+'</div><div class="panel"><h3>Piani manutenzione dai MUM · prima estrazione</h3><div class="note">Le soglie orarie identificano famiglie di attività previste dai manuali, non attività tutte equivalenti e non sostituiscono le schede del costruttore. Registrare i contaore e l’ultima esecuzione per ciascuna operazione prima di calcolare la sua prossima soglia.</div>'+tabella(['Equipment','Tipologia','Soglie MUM da dettagliare','Contaore attuale','Aggiorna','Fonte / limiti'],rows)+'</div>'}

function scadenze(){let arr=db.controlli.filter(x=>x.prossima);return suggestedChecks()+'<div class="note warn">Inserisci la periodicità solo se documentata nel MUM, nel piano di manutenzione o nelle disposizioni applicabili. Le date di verifica SAP non consentono da sole di stabilire la prossima scadenza.</div><div class="toolbar"><button class="btn primary" onclick="editControllo()">+ Registra controllo / piano</button></div>'+tabella(['Mezzo','Tipo','Ultima verifica','Prossima','Esito',''],db.controlli.map((x,i)=>'<tr><td>'+esc(x.mezzo)+'</td><td>'+esc(x.tipo)+'</td><td>'+fmtDate(x.ultima)+'</td><td>'+(x.prossima?fmtDate(x.prossima)+(days(x.prossima)<0?' <span class="tag OFF">Da verificare</span>':''):'Da definire')+'</td><td>'+esc(x.esito)+'</td><td><button class="click" onclick="editControllo('+i+')">Apri</button></td></tr>'))}
function controlli(){return '<div class="toolbar"><button class="btn primary" onclick="editControllo()">+ Nuova registrazione</button></div>'+ (db.controlli.length?tabella(['Equipment','Attività','Effettuata','Prossima','Esito'],db.controlli.map(x=>'<tr><td>'+esc(x.mezzo)+'</td><td>'+esc(x.tipo)+'</td><td>'+fmtDate(x.ultima)+'</td><td>'+fmtDate(x.prossima)+'</td><td>'+esc(x.esito)+'</td></tr>')):'<div class="panel empty">Nessun controllo registrato. Le verifiche storiche SAP non sono ancora trasformate in piani periodici.</div>')}

)+'> '+esc(c)+'</label>').join('')+'</div></div><label class="full">Note<textarea class="field" name="note">'+esc(x.note)+'</textarea></label><div class="full actions"><button class="btn primary">Salva fascicolo</button></div></form>')}
function saveCantiere(e,i){e.preventDefault();let fd=new FormData(e.target),v=Object.fromEntries(fd.entries());let x={...v,mezzi:fd.getAll('mdo_'),checks:{}};for(let n=0;n<8;n++)x.checks[n]=fd.has('check'+n);Object.keys(x).filter(k=>k.startsWith('check')||k==='mdo_').forEach(k=>delete x[k]);if(i<0)db.cantieri.push(x);else db.cantieri[i]=x;save();closeModal();render()}
function calcoli(){return '<div class="note bad"><b>Modulo in preparazione — nessuna idoneità alla circolazione viene calcolata.</b> Le formule normative e le regole di composizione, frenatura, prestazione e immobilizzazione saranno attivate soltanto dopo verifica e collaudo. I conteggi seguenti sono aritmetici, non costituiscono una verifica ferroviaria.</div><div class="panel"><h2>Composizione preliminare</h2><p class="muted">Seleziona gli equipment: per ciascuno deve essere validata la massa effettiva, compreso il carico.</p><div class="toolbar"><button class="btn" onclick="clearCalc()">Azzera</button></div><div class="tablewrap"><table><thead><tr><th>Seleziona</th><th>Equipment</th><th>Descrizione</th><th>Stato</th><th>Massa SAP (t)</th></tr></thead><tbody>'+db.mezzi.filter(x=>x.stato!=='SOPP'&&!x.archiviato).map(m=>'<tr><td><input type="checkbox" class="calcCheck" value="'+esc(m.id)+'" onchange="runCalc()"></td><td>'+esc(m.id)+'</td><td>'+esc(m.nome)+'</td><td>'+tag(m.stato)+'</td><td>'+esc(m.massa||'n.d.')+'</td></tr>').join('')+'</tbody></table></div><div id="calcOut" class="panel" style="margin-top:15px">Seleziona i mezzi da confrontare.</div></div>'}
function runCalc(){let ids=[...document.querySelectorAll('.calcCheck:checked')].map(x=>x.value),m=db.mezzi.filter(x=>ids.includes(x.id));let has=m.every(x=>typeof x.massa==='number'&&x.massa>0),total=m.reduce((s,x)=>s+(Number(x.massa)||0),0);document.getElementById('calcOut').innerHTML='<h3>Riepilogo aritmetico</h3><p><b>Elementi:</b> '+m.length+' · <b>Somma masse SAP disponibili:</b> '+total.toLocaleString('it-IT')+' t</p><p>'+(!has?'⚠ Mancano una o più masse. ':'')+'<b>Non validato:</b> massa effettiva, frenatura, compatibilità di aggancio, composizione, prestazioni, velocità e immobilizzazione.</p><p class="small muted">Anche se tutti i mezzi risultano ESER, occorre confermare prescrizioni, documentazione, carico e condizioni di linea.</p>'}
function clearCalc(){document.querySelectorAll('.calcCheck').forEach(x=>x.checked=false);runCalc()}
function imprese(){return '<div class="toolbar"><button class="btn primary" onclick="editImpresa()">+ Aggiungi impresa</button></div>'+tabella(['Impresa','Referente','Contatto'],db.imprese.map((x,i)=>'<tr><td>'+esc(x.nome)+'</td><td>'+esc(x.referente)+'</td><td>'+esc(x.contatto)+'</td></tr>'))}

function saveImpresa(e){e.preventDefault();db.imprese.push(Object.fromEntries(new FormData(e.target).entries()));save();closeModal();render()}
function admin(){return '<div class="panel"><h2>Amministrazione locale</h2><div class="note warn">Questa versione non dispone ancora di account, ruoli, autenticazione, audit sicuro o sincronizzazione. Non caricare dati riservati o documenti aziendali non autorizzati su servizi pubblici.</div><div class="stack"><div><b>Avvisi scadenze</b><p>Giorni di preavviso <input class="field" type="number" min="1" max="365" id="alertDays" value="'+db.config.alertDays+'"> <button class="btn" onclick="db.config.alertDays=Number(document.getElementById(\'alertDays\').value)||30;save();render()">Salva</button></p></div><div><b>Backup e trasferimento</b><p class="muted small">I dati vengono salvati nel browser utilizzato. Esporta regolarmente un backup e importalo per ripristinarli o spostarli.</p><div class="toolbar"><button class="btn primary" onclick="exportJson()">Esporta backup JSON</button><label class="btn">Importa backup JSON<input type="file" accept=".json,application/json" hidden onchange="importJson(event)"></label><button class="btn" onclick="exportCsv()">Esporta anagrafica CSV</button></div></div><div><b>Reset</b><p class="muted small">Ripristina gli equipment SAP iniziali. Le modifiche locali saranno eliminate.</p><button class="btn danger" onclick="resetData()">Ripristina dati iniziali</button></div></div></div>'}
function dl(name,body,type){let url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJson(){dl('mdo-manager-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json')}
function exportCsv(){let cols=['id','nome','stato','proprieta','impresa','sede','libretto','massa','potenza','causa'];let lines=[cols.join(';'),...db.mezzi.map(m=>cols.map(k=>'"'+String(m[k]??'').replaceAll('"','""')+'"').join(';'))];dl('mdo-anagrafica.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8')}
function importJson(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!Array.isArray(v.mezzi)||!Array.isArray(v.controlli))throw Error('Formato non riconosciuto');if(!confirm('Sostituire tutti i dati presenti con il backup selezionato?'))return;db=v;save();render()}catch(err){alert('Backup non valido: '+err.message)}};reader.readAsText(f)}
function resetData(){if(confirm('Cancellare tutte le modifiche e ripristinare i 25 MdO iniziali?')&&confirm('Confermi definitivamente?')){db=structuredClone(initial);save();render()}}

function sapDate(s){if(!s)return '';const a=s.split('/');return a.length===3?a[2]+'-'+a[1]+'-'+a[0]:s}
function sapEuro(v){const n=Number(String(v||'').replaceAll('.','').replace(',','.'));return Number.isFinite(n)?n:0}
function sapordini(){const all=db.sapOrdini||[],matched=new Set(all.map(o=>o.equipment)),oggi=new Date().toISOString().slice(0,10),fut=all.filter(o=>sapDate(o.dataInizioBase)>oggi&&!o.inizioEffettivo),unassigned=all.filter(o=>!db.mezzi.some(m=>m.id===o.equipment)),filt=window.sapFiltro||'';const shown=all.filter(o=>!filt||[o.ordine,o.equipment,o.testo,o.tipo].some(v=>String(v||'').toLowerCase().includes(filt.toLowerCase()))).sort((a,b)=>sapDate(b.riferimento).localeCompare(sapDate(a.riferimento)));
let out='<div class="note"><b>Fonte:</b> export SAP 15/10/2026 · Tipologie ordini e valori conservati senza reinterpretazione. <b>Un ODL non prova che una verifica sia stata superata.</b> La data inizio effettivo indica un dato di esecuzione, non un verbale di esito. La data di fine base è una data di pianificazione.</div><section class="kpis">'+kpi(all.length,'Ordini SAP')+kpi(matched.size,'Equipment con ordini')+kpi(fut.length,'Ordini futuri senza inizio eff.')+kpi(unassigned.length,'ODL senza equipment censito')+kpi(all.filter(x=>x.inizioEffettivo).length,'ODL con inizio effettivo')+'</section>';
out+='<div class="panel"><h2>Ordini e verifiche SAP</h2><div class="toolbar"><input class="field grow" placeholder="Filtra per equipment, ODL, descrizione..." value="'+esc(filt)+'" oninput="window.sapFiltro=this.value;sapAggiornaTabella()"><button class="btn" onclick="document.getElementById(&quot;sapUpload&quot;).click()">Importa CSV SAP</button><input id="sapUpload" type="file" accept=".csv,text/csv" hidden onchange="sapImport(event)"><button class="btn" onclick="sapDownload()">Esporta ordini CSV</button></div><p class="small muted" id="sapCount">'+shown.length+' ordini visibili su '+all.length+'</p><div id="sapTable">'+sapRenderTable(shown)+'</div></div>';
out+='<div class="panel"><h2>Prossimi controlli programmati</h2>'+tabella(['Equipment','Ordine','Descrizione','Data prevista','Situazione'],fut.sort((a,b)=>sapDate(a.dataInizioBase).localeCompare(sapDate(b.dataInizioBase))).map(o=>'<tr><td>'+esc(o.equipment)+'</td><td>'+esc(o.ordine)+'</td><td>'+esc(o.testo)+'</td><td>'+esc(o.dataInizioBase)+'</td><td>'+tag('DA_VERIFICARE')+' Programmato</td></tr>'))+'</div>';return out}
function sapRenderTable(items){return tabella(['ODL','Equipment','Tipo','Descrizione','Inizio base','Fine base','Inizio eff.','Costi eff. €'],items.map(o=>'<tr><td>'+esc(o.ordine)+'</td><td><button class="click" onclick="sapMezzo(this.dataset.eq)" data-eq="'+esc(o.equipment)+'">'+esc(o.equipment)+'</button></td><td>'+esc(o.tipo)+'</td><td>'+esc(o.testo)+'</td><td>'+esc(o.dataInizioBase)+'</td><td>'+esc(o.dataFineBase)+'</td><td>'+(o.inizioEffettivo?esc(o.inizioEffettivo):'<span class="muted">Non registrato</span>')+'</td><td>'+esc(o.costoEffettivo)+'</td></tr>'))}
function sapAggiornaTabella(){const q=window.sapFiltro||'';const all=db.sapOrdini||[];const r=all.filter(o=>!q||[o.ordine,o.equipment,o.testo,o.tipo].some(v=>String(v||'').toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>sapDate(b.riferimento).localeCompare(sapDate(a.riferimento)));document.getElementById('sapTable').innerHTML=sapRenderTable(r);document.getElementById('sapCount').textContent=r.length+' ordini visibili su '+all.length}
function sapMezzo(id){const m=db.mezzi.find(x=>x.id===id);const o=db.sapOrdini.filter(x=>x.equipment===id);modal('<h2>Equipment '+esc(id)+'</h2><p><b>'+esc(m?.nome||'Non presente nell’anagrafica')+'</b> · '+(m?tag(m.stato):'')+'</p><p>'+o.length+' ordini SAP collegati. Nessun esito di verifica viene dedotto dall’ODL.</p>'+sapRenderTable(o));}
function sapCsvParse(content){const lines=content.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());const split=(line)=>{const a=[];let cur='',quote=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++;}else quote=!quote;}else if(c===';'&&!quote){a.push(cur);cur=''}else cur+=c;}a.push(cur);return a};const h=split(lines[0]).map(x=>x.trim());if(!h.includes('Equipment')||!h.includes('Ordine')||!h.includes('Tipo di ordine'))throw Error('Mancano intestazioni SAP attese');return lines.slice(1).map(l=>Object.fromEntries(split(l).map((v,i)=>[h[i],v]))).filter(r=>/^\d+$/.test(r.Ordine||'')&&/^\d+$/.test(r.Equipment||'')).map(a=>({ordine:a['Ordine'],tipo:a['Tipo di ordine'],equipment:a['Equipment'],testo:a['Testo breve']||'',riferimento:a['Data di riferimento']||'',rilascio:a['Data rilascio eff.']||'',inizioEffettivo:a['Data inizio eff.']||'',dataInizioBase:a['Data inizio cardine']||'',dataFineBase:a['Data di fine di base']||'',costoPianificato:a['Costi totali pian.']||'',costoEffettivo:a['Costi tot. effettivi']||'',sede:a['Sede tecnica']||''}))}
function sapImport(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=sapCsvParse(String(reader.result));if(!parsed.length)throw Error('Nessun ordine');const map=new Map((db.sapOrdini||[]).map(x=>[String(x.ordine),x]));for(const x of parsed)map.set(String(x.ordine),x);if(!confirm('Importare '+parsed.length+' ordini? Gli ODL con lo stesso numero saranno aggiornati; gli altri dati locali rimarranno invariati.'))return;db.sapOrdini=[...map.values()];save();render();alert('Importati '+parsed.length+' ordini. Archivio ora: '+db.sapOrdini.length);}catch(err){alert('Errore importazione: '+err.message)}};reader.readAsText(file,'UTF-8');}
function sapDownload(){const cols=['ordine','equipment','tipo','testo','riferimento','dataInizioBase','dataFineBase','inizioEffettivo','costoPianificato','costoEffettivo'];const text=[cols.join(';'),...db.sapOrdini.map(o=>cols.map(k=>'"'+String(o[k]||'').replaceAll('"','""')+'"').join(';'))].join('\r\n');dl('mdo-ordini-sap.csv','\uFEFF'+text,'text/csv;charset=utf-8')}

function addMonthsIso(s,n){if(!/^\d{4}-\d\d-\d\d$/.test(s||''))return '';const [y,m,d]=s.split('-').map(Number),t=new Date(Date.UTC(y,m-1+n,1)),last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();return new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),Math.min(d,last))).toISOString().slice(0,10)}
function statusLabel(m){return m.stato==='ESER'?'ESER · in esercizio':m.stato==='FUES'?'FUES · fuori esercizio':m.stato==='OFF'?'OFF · officina':m.stato==='SOPP'?'SOPP · soppresso':'Stato da verificare'}
function annualLast(m){return m.verifiche?.ultima_annuale||''}
function deadlines(m){const q=m.verifiche?.ultima_quinquennale||'';const a=annualLast(m);const l=m.verifiche?.ultima_soll_acc||'';return [
{tipo:'Annuale MdO',date:a?addMonthsIso(a,12):'',reference:a,source:'Data ultima annuale confermata'},
{tipo:'Periodica · 33 mesi',date:q?addMonthsIso(q,33):'',reference:q,source:'Ultima quinquennale'},
{tipo:'Quinquennale · 60 mesi',date:q?addMonthsIso(q,60):'',reference:q,source:'Ultima quinquennale'},
{tipo:'Sollevamento · annuale',date:l?addMonthsIso(l,12):'',reference:l,source:'Ultima verifica sollevamento'}]}
function dateStatus(dt){if(!dt)return 'Dato mancante';const d=days(dt);return d<0?'Da verificare: data superata':d<=db.config.alertDays?'In scadenza':'Data futura'}
function dashboard(){const m=db.mezzi, count=k=>m.filter(x=>x.stato===k).length;const pending=db.sapOrdini.filter(x=>x.tipo==='240'&&sapDate(x.dataInizioBase)>new Date().toISOString().slice(0,10)&&!x.inizioEffettivo).sort((a,b)=>sapDate(a.dataInizioBase).localeCompare(sapDate(b.dataInizioBase)));let alerts=m.flatMap(x=>deadlines(x).filter(v=>v.date&&days(v.date)<=db.config.alertDays).map(v=>({...v,mezzo:x}))).sort((a,b)=>a.date.localeCompare(b.date));return '<div class="note">25 anagrafiche iniziali e '+db.sapOrdini.length+' ODL SAP. Le scadenze sono <b>proiezioni documentali</b>: per confermare esito e idoneità servono i verbali. Un ordine SAP non equivale a verifica superata.</div><section class="kpis">'+kpi(m.length,'Mezzi complessivi')+kpi(count('ESER'),'ESER')+kpi(count('FUES'),'FUES')+kpi(count('OFF'),'OFF')+kpi(count('SOPP'),'SOPP')+'</section><div class="grid2"><div class="panel"><h2>Verifiche da presidiare</h2>'+(alerts.slice(0,8).map(v=>'<div class="item"><b>'+esc(v.mezzo.id)+' · '+esc(v.tipo)+'</b><div class="small">'+fmtDate(v.date)+' · '+dateStatus(v.date)+'</div></div>').join('')||'<p class="muted">Nessuna data calcolata nel periodo di preavviso.</p>')+'<div class="actions"><button class="btn primary" onclick="show(\'scadenze\')">Apri scadenziario</button></div></div><div class="panel"><h2>ODL 240 programmati</h2>'+pending.slice(0,7).map(o=>'<div class="item"><b>'+esc(o.equipment)+'</b> · '+esc(o.testo)+'<div class="small">Data cardine '+esc(o.dataInizioBase)+' · ODL '+esc(o.ordine)+'</div></div>').join('')+'<div class="actions"><button class="btn" onclick="show(\'calcoli\')">Prepara convoglio</button></div></div></div>'}
function parco(){return '<div class="toolbar"><input class="field grow" id="q" placeholder="Cerca matricola, equipment, impresa..." oninput="filterMezzi()"><select class="field" id="statefilter" onchange="filterMezzi()"><option value="">Tutti gli stati</option>'+['ESER','FUES','OFF','SOPP','DA_VERIFICARE'].map(s=>'<option>'+s+'</option>').join('')+'</select><button class="btn primary" onclick="editMezzo()">+ Mezzo</button></div><div id="mtable"></div>'}
function filterMezzi(){const q=(document.getElementById('q')?.value||'').toLowerCase(),s=document.getElementById('statefilter')?.value||'';const m=db.mezzi.filter(x=>(!s||x.stato===s)&&[x.id,x.nome,x.libretto,x.impresa,x.modello].join(' ').toLowerCase().includes(q));document.getElementById('mtable').innerHTML=tabella(['ID / Matricola','Mezzo','Origine','Stato','Quinquennale','Selezionabile',''],m.map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.nome)+'</td><td>'+esc(x.proprieta||'RFI')+(x.impresa?' · '+esc(x.impresa):'')+'</td><td>'+tag(x.stato)+'</td><td>'+fmtDate(x.verifiche?.ultima_quinquennale)+'</td><td>'+(x.proprieta==='IMPRESA'?(x.abilitaComposizione?'Sì, con controlli':'No'):'Verificare')+'</td><td><button class="click" onclick="editMezzo(\''+esc(x.id)+'\')">Apri →</button></td></tr>'))}
function tecnicaEditor(t){const fields=[['massa_vuoto_t','Massa a vuoto (t)'],['carico_massimo_t','Carico massimo (t)'],['massa_frenata_vuoto_t','Massa frenata a vuoto (t)'],['massa_frenata_carico_t','Massa frenata a carico (t)'],['massa_frenata_stazionamento_t','Massa frenata di stazionamento (t)'],['numero_assi','Numero assi'],['velocita_composizione_kmh','Velocità in composizione (km/h)'],['velocita_autonoma_kmh','Velocità autonoma (km/h)'],['velocita_lavoro_kmh','Velocità di lavoro (km/h)'],['lunghezza_mm','Lunghezza (mm)'],['potenza_kw','Potenza (kW)']];return fields.map(([k,v])=>'<label>'+v+'<input class="field" type="number" step="any" min="0" name="tech_'+k+'" value="'+esc(t[k]??'')+'"></label>').join('')+'<label>Tipo aggancio<input class="field" name="tech_aggancio" value="'+esc(t.aggancio??'')+'"></label><label>Tipo frenatura<input class="field" name="tech_frenatura" value="'+esc(t.frenatura??'')+'"></label>'}
function editMezzo(id){const x=db.mezzi.find(m=>m.id===id)||{id:'',nome:'',stato:'DA_VERIFICARE',proprieta:'RFI',impresa:'',libretto:'',tecnica:{},verifiche:{},abilitaComposizione:false};const isNew=!id;modal('<h2>'+(isNew?'Nuovo mezzo':'Scheda '+esc(x.id))+'</h2><form class="formgrid" onsubmit="saveMezzoV4(event,'+(isNew?'true':'false')+')"><label>Equipment / identificativo *<input required class="field" name="id" value="'+esc(x.id)+'" '+(isNew?'':'readonly')+'></label><label>Descrizione *<input required class="field" name="nome" value="'+esc(x.nome)+'"></label><label>Proprietà<select class="field" name="proprieta">'+['RFI','IMPRESA'].map(v=>'<option '+(x.proprieta===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label>Impresa<input class="field" name="impresa" value="'+esc(x.impresa||'')+'" list="lista-imprese"><datalist id="lista-imprese">'+db.imprese.map(i=>'<option value="'+esc(i.nome)+'">').join('')+'</datalist></label><label>Stato<select class="field" name="stato">'+['ESER','FUES','OFF','SOPP','DA_VERIFICARE'].map(v=>'<option '+(x.stato===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label>Modello MUM<input class="field" name="modello" value="'+esc(x.modello||'')+'" placeholder="Es. SAEM S45"></label><label>Codice libretto<input class="field" name="libretto" value="'+esc(x.libretto||'')+'"></label><label>Nucleo / sede<input class="field" name="sede" value="'+esc(x.sede||'')+'"></label><label class="full">Causa fermo / limitazioni<input class="field" name="causa" value="'+esc(x.causa||'')+'"></label><label class="full"><input type="checkbox" name="abilitaComposizione" '+(x.abilitaComposizione?'checked':'')+'> Mezzo di impresa selezionabile per la predisposizione di composizioni (non è autorizzazione alla circolazione)</label><h3 class="full">Verifiche documentate</h3><label>Ultima quinquennale (data esecuzione)<input class="field" type="date" name="ultima_quinquennale" value="'+esc(x.verifiche?.ultima_quinquennale||'')+'"></label><label>Ultima annuale (data esecuzione)<input class="field" type="date" name="ultima_annuale" value="'+esc(x.verifiche?.ultima_annuale||'')+'"></label><label>Ultima verifica sollevamento<input class="field" type="date" name="ultima_soll_acc" value="'+esc(x.verifiche?.ultima_soll_acc||'')+'"></label><label>Fonte delle date (facoltativa)<input class="field" name="fonte_date" value="'+esc(x.fonte_date||'')+'" placeholder="Verbale / RUMO / SAP da verificare"></label><h3 class="full">Caratteristiche tecniche</h3>'+tecnicaEditor(x.tecnica||{})+'<label class="full">Note<input class="field" name="note" value="'+esc(x.note||'')+'"></label><div class="full"><b>Carta di circolazione</b><p class="small muted">'+esc(x.carta_file||'Nessun documento allegato in archivio locale')+'</p><label class="btn">Allega PDF carta<input type="file" accept=".pdf,application/pdf" style="display:none" onchange="attachDoc(event,\''+esc(x.id)+'\',\'carta\')"></label> <button type="button" class="btn" onclick="openDoc(\''+esc(x.id)+'\',\'carta\')">Apri allegato</button></div><div class="full actions"><button type="button" class="btn" onclick="closeModal()">Annulla</button><button class="btn primary">Salva scheda</button></div></form>')}
function saveMezzoV4(e,isNew){e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f.entries()),old=db.mezzi.find(x=>x.id===v.id);if(isNew&&old)return alert('Identificativo già esistente');if(v.stato==='ESER'&&(!old||old.stato!=='ESER')&&!confirm('Confermi la registrazione dello stato ESER? Questa operazione non sostituisce la verifica di idoneità.'))return;const t={...(old?.tecnica||{})};for(const [k,val] of f.entries())if(k.startsWith('tech_')){const name=k.slice(5);if(val==='')delete t[name];else t[name]=['aggancio','frenatura'].includes(name)?val:Number(val)};const m={...(old||{}),id:v.id,nome:v.nome,proprieta:v.proprieta,impresa:v.impresa,stato:v.stato,modello:v.modello,libretto:v.libretto,sede:v.sede,causa:v.causa,note:v.note,fonte_date:v.fonte_date,abilitaComposizione:f.has('abilitaComposizione'),tecnica:t,verifiche:{...(old?.verifiche||{}),ultima_quinquennale:v.ultima_quinquennale,ultima_annuale:v.ultima_annuale,ultima_soll_acc:v.ultima_soll_acc}};if(old)db.mezzi[db.mezzi.indexOf(old)]=m;else db.mezzi.push(m);save();closeModal();render()}
function scadenze(){let entries=db.mezzi.flatMap(m=>deadlines(m).map(x=>({...x,m})));const planned=db.sapOrdini.filter(x=>x.tipo==='240').sort((a,b)=>sapDate(b.dataInizioBase).localeCompare(sapDate(a.dataInizioBase)));return '<div class="note">Le annuali sono calcolate dall’ultima annuale registrata; periodica a <b>33 mesi</b> e quinquennale a <b>60 mesi</b> dall’ultima quinquennale. Queste sono proiezioni: non attestano esito o disponibilità. Il ciclo annuale non viene ricostruito automaticamente come verifica eseguita.</div><div class="toolbar"><button class="btn primary" onclick="show(\'amministrazione\')">Aggiorna date dalle schede</button><label>Preavviso <input type="number" class="field" min="1" max="365" value="'+db.config.alertDays+'" style="width:85px" onchange="db.config.alertDays=Number(this.value)||30;save();render()"> giorni</label></div>'+tabella(['Mezzo','Verifica','Ultima fonte / base','Prossima teorica','Indicazione'],entries.map(x=>'<tr><td><button class="click" onclick="editMezzo(\''+esc(x.m.id)+'\')">'+esc(x.m.id)+'</button></td><td>'+esc(x.tipo)+'</td><td>'+fmtDate(x.reference)+'</td><td>'+fmtDate(x.date)+'</td><td>'+esc(dateStatus(x.date))+'</td></tr>'))+'<div class="panel"><h2>Sollevamento · ODL 240 SAP</h2><p class="muted small">Le date cardine degli ODL non dimostrano l’esito della verifica. Conserviamo l’ordine, l’eventuale inizio effettivo e la data pianificata.</p>'+tabella(['Equipment','ODL','Data cardine','Inizio effettivo','Attività'],planned.map(o=>'<tr><td>'+esc(o.equipment)+'</td><td>'+esc(o.ordine)+'</td><td>'+esc(o.dataInizioBase)+'</td><td>'+esc(o.inizioEffettivo||'—')+'</td><td>'+esc(o.testo)+'</td></tr>'))+'</div>'}
const compDraft={ids:[],tratta:'',binario:'',pendenza:'',data:'',note:''};
function chooseCandidate(){return db.mezzi.filter(m=>m.stato!=='SOPP'&&(m.proprieta!=='IMPRESA'||m.abilitaComposizione))}
function calcoli(){const d=window.compDraft||{...compDraft,ids:[]};window.compDraft=d;const avail=chooseCandidate();return '<div class="note">Preparazione assistita, <b>non autorizzazione alla circolazione</b>. Verificare agganci, frenatura, masse, restrizioni, abilitazioni e Fascicolo Linea. I documenti M.40 MdO ufficiali richiedono controllo, compilazione delle attestazioni e sottoscrizione del personale competente.</div><div class="panel"><h2>1 · Composizione</h2><div class="toolbar"><select id="compAdd" class="field grow">'+avail.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.id+' · '+m.nome+(m.stato==='ESER'?'':' · '+m.stato))+'</option>').join('')+'</select><button class="btn primary" onclick="addComp()">+ Aggiungi</button></div><div id="compList">'+renderCompList(d)+'</div></div><div class="panel"><h2>2 · Dati della tratta</h2><div class="formgrid"><label>Tratta / linea<input class="field" id="compTratta" value="'+esc(d.tratta||'')+'" oninput="window.compDraft.tratta=this.value"></label><label>Binario<input class="field" id="compBinario" value="'+esc(d.binario||'')+'" oninput="window.compDraft.binario=this.value"></label><label>Pendenza da verificare (‰)<input class="field" type="number" step="0.1" id="compPendenza" value="'+esc(d.pendenza||'')+'" oninput="window.compDraft.pendenza=this.value"></label><label>Data prevista<input class="field" type="date" value="'+esc(d.data||'')+'" oninput="window.compDraft.data=this.value"></label><label class="full">Note / prescrizioni<input class="field" value="'+esc(d.note||'')+'" oninput="window.compDraft.note=this.value"></label></div></div><div class="panel"><h2>3 · Riepilogo tecnico e scheda</h2><div id="compResult">'+renderCompResult(d)+'</div><div class="actions"><button class="btn" onclick="printComp()">Stampa scheda preparatoria</button><button class="btn primary" onclick="saveComp()">Salva composizione</button></div></div>'}
function renderCompList(d){return d.ids.length?tabella(['Posizione','Mezzo','Stato','Azioni'],d.ids.map((id,i)=>{const m=db.mezzi.find(x=>x.id===id);return '<tr><td>'+(i+1)+'</td><td>'+esc(id)+' · '+esc(m?.nome||'non individuato')+'</td><td>'+esc(m?.stato||'—')+'</td><td><button class="btn" onclick="moveComp('+i+',-1)">↑</button> <button class="btn" onclick="moveComp('+i+',1)">↓</button> <button class="btn" onclick="removeComp('+i+')">×</button></td></tr>'})): '<div class="empty">Aggiungi uno o più mezzi per iniziare.</div>'}
function addComp(){const id=document.getElementById('compAdd')?.value;if(!id)return;window.compDraft.ids.push(id);refreshComp()}
function removeComp(i){window.compDraft.ids.splice(i,1);refreshComp()}
function moveComp(i,n){const a=window.compDraft.ids,j=i+n;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];refreshComp()}
function refreshComp(){document.getElementById('compList').innerHTML=renderCompList(window.compDraft);document.getElementById('compResult').innerHTML=renderCompResult(window.compDraft)}
function renderCompResult(d){const ms=d.ids.map(id=>db.mezzi.find(m=>m.id===id)).filter(Boolean);let sum=0,known=0,issues=[];ms.forEach(m=>{const v=m.tecnica?.massa_vuoto_t??m.massa;if(v!==''&&v!=null&&Number.isFinite(Number(v))&&Number(v)>0){sum+=Number(v);known++}else issues.push(m.id+': massa non disponibile');if(m.stato!=='ESER')issues.push(m.id+': stato '+m.stato+' (non regolare)');if(m.proprieta==='IMPRESA'&&!m.abilitaComposizione)issues.push(m.id+': impresa non selezionabile');for(const x of deadlines(m).slice(0,3)){if(!x.date)issues.push(m.id+': '+x.tipo+' senza data');else if(days(x.date)<0)issues.push(m.id+': '+x.tipo+' data teorica superata')}if(!m.tecnica?.aggancio)issues.push(m.id+': compatibilità aggancio da verificare');if(!m.tecnica?.frenatura)issues.push(m.id+': frenatura da verificare')});if(!d.tratta)issues.push('Tratta e relative prescrizioni non definite');return '<p><b>Mezzi:</b> '+ms.length+' · <b>Somma delle tare disponibili:</b> '+sum.toLocaleString('it-IT')+' t (dati presenti: '+known+'/'+ms.length+')</p><p class="muted small">La massa effettiva del convoglio NON coincide necessariamente con la somma delle tare; carichi, masse frenate e altri parametri non sono validati.</p><h3>Punti da verificare</h3>'+(issues.length?'<ul>'+issues.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>':'<p>Controlli documentali di base compilati; restano da validare le condizioni normative, il personale e la circolazione.</p>')+'<div class="note warn">Esito: verifica operativa NON effettuata. Nessuna idoneità o numero di staffe viene determinato automaticamente.</div>'}
function saveComp(){const d=window.compDraft;if(!d.ids.length)return alert('Seleziona almeno un mezzo');db.compositions.push({...d,ids:[...d.ids],id:Date.now().toString(),salvato:new Date().toISOString()});save();alert('Composizione preparatoria salvata in questo browser')}
function printComp(){const d=window.compDraft;if(!d.ids.length)return alert('Seleziona prima almeno un mezzo');const html='<html><head><meta charset="utf-8"><title>Scheda preparatoria convoglio</title><style>body{font:13px Arial;padding:30px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #777;padding:8px}h1{color:#174666}p{line-height:1.5}</style></head><body><h1>MDO Manager · Scheda preparatoria composizione</h1><p><b>Non costituisce M.40 MdO ufficiale, attestazione o autorizzazione alla circolazione.</b></p><p>Tratta: '+esc(d.tratta)+' · Binario: '+esc(d.binario)+' · Pendenza dichiarata: '+esc(d.pendenza)+'‰ · Data: '+esc(d.data)+'</p><table><tr><th>Posizione</th><th>Equipment</th><th>Descrizione</th><th>Stato</th></tr>'+d.ids.map((id,i)=>{const m=db.mezzi.find(x=>x.id===id);return '<tr><td>'+(i+1)+'</td><td>'+esc(id)+'</td><td>'+esc(m?.nome||'')+'</td><td>'+esc(m?.stato||'')+'</td></tr>'}).join('')+'</table><h2>Riepilogo / verifiche preliminari</h2>'+renderCompResult(d)+'<p>Note: '+esc(d.note)+'</p><p>Controllo personale abilitato: __________________  Data: __________</p></body></html>';const w=window.open('','_blank');if(!w)return alert('Permetti l’apertura delle finestre per stampare');w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),350)}
function admin(){return '<div class="note">Gestione locale sul dispositivo. I documenti PDF vengono conservati in IndexedDB del browser (non sono inclusi nel backup JSON). Fai copie separate dei PDF originali. Non pubblicare dati aziendali senza autorizzazione.</div><div class="grid2"><div class="panel"><h2>Anagrafiche MdO</h2><p>Modifica caratteristiche, verifiche, stati e carte di circolazione di tutti i mezzi.</p><div class="toolbar"><select class="field grow" id="adminMezzo">'+db.mezzi.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.id+' · '+m.nome)+'</option>').join('')+'</select><button class="btn primary" onclick="editMezzo(document.getElementById(\'adminMezzo\').value)">Modifica</button></div><button class="btn" onclick="editMezzo()">+ Nuovo mezzo</button></div><div class="panel"><h2>Imprese</h2><button class="btn primary" onclick="editImpresa()">+ Impresa</button><p class="muted small">Registra l’impresa e poi crea il relativo MdO. Nella scheda del mezzo carica la carta e attiva, se appropriato, la selezione per la composizione.</p>'+tabella(['Impresa','Contatto'],db.imprese.map(x=>'<tr><td>'+esc(x.nome)+'</td><td>'+esc(x.contatto||'—')+'</td></tr>'))+'</div><div class="panel"><h2>Manuali tipologici</h2><p class="small muted">Un solo MUM per famiglia o modello; le carte restano individuali.</p><div class="toolbar"><input id="mumName" class="field grow" placeholder="Modello / famiglia (es. SAEM S45)"><label class="btn">Allega PDF MUM<input type="file" accept=".pdf" hidden onchange="attachManual(event)"></label></div>'+tabella(['Modello','PDF'],db.manualLibrary.map(x=>'<tr><td>'+esc(x.modello)+'</td><td><button class="click" onclick="openDoc(\'MUM:'+esc(x.modello)+'\',\'mum\')">Apri '+esc(x.nome)+'</button></td></tr>'))+'</div><div class="panel"><h2>Dati e importazioni</h2><div class="toolbar"><button class="btn primary" onclick="exportJson()">Backup JSON</button><label class="btn">Ripristina backup<input type="file" accept=".json" hidden onchange="importJson(event)"></label></div><div class="toolbar"><label class="btn">Importa ordini SAP CSV<input type="file" accept=".csv" hidden onchange="sapImport(event)"></label><button class="btn" onclick="sapDownload()">Esporta ODL CSV</button></div><p><b>'+db.sapOrdini.length+'</b> ordini SAP conservati</p><label>Preavviso giorni <input class="field" type="number" min="1" max="365" value="'+db.config.alertDays+'" onchange="db.config.alertDays=Number(this.value)||30;save()"></label></div></div>'}
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('mdo_docs_local_v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function storePdf(key,file){const dbi=await openDb();return new Promise((resolve,reject)=>{const tx=dbi.transaction('docs','readwrite');tx.objectStore('docs').put(file,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function fetchPdf(key){const dbi=await openDb();return new Promise((resolve,reject)=>{const tx=dbi.transaction('docs','readonly'),r=tx.objectStore('docs').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function attachDoc(e,id,kind){const file=e.target.files?.[0];if(!file)return;if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf'))return alert('Seleziona un PDF');try{await storePdf(id+':'+kind,file);const m=db.mezzi.find(x=>x.id===id);if(m){m.carta_file=file.name;m.carta=true;save()}alert('PDF salvato nel browser. Riapri la scheda per visualizzarlo.')}catch(err){alert('Impossibile salvare il documento: '+err.message)}}

async function mdo9SaveCompany(e){e.preventDefault();if(!mdoSession)return alert('Accesso necessario');const f=new FormData(e.target),firm=String(f.get('impresa')||'').trim(),raw=String(f.get('matricola')||'').trim();if(!firm||!raw)return alert('Impresa e matricola obbligatorie');const id='IMP-'+firm.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,24)+'-'+raw.toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,40);if(db.mezzi.some(m=>m.id===id))return alert('Questo mezzo risulta già censito; utilizza la scheda presente');const t={};for(const k of ['numero_assi','massa_vuoto_t','carico_massimo_t','massa_frenata_vuoto_t','massa_frenata_carico_t','lunghezza_mm','velocita_composizione_kmh']){let v=f.get(k);if(v!==''&&v!==null)t[k]=Number(v)}for(const k of ['aggancio','frenatura'])if(f.get(k))t[k]=String(f.get(k));const m={id,nome:String(f.get('nome')),modello:String(f.get('modello')||''),impresa:firm,proprieta:'IMPRESA',stato:'DA_VERIFICARE',abilitaComposizione:true,tecnica:t,fonte_date:String(f.get('fonte')||''),verifiche:{}};try{mdoStatus('Salvataggio mezzo impresa…');const {error}=await mdoClient.from('mdo_mezzi').insert(mdoRow(m));if(error)throw error;await mdoLoadRemote();closeModal();render();mdoStatus('Mezzo di '+firm+' salvato online');alert('MdO salvato e riutilizzabile negli studi. La sua idoneità operativa resta da verificare.') }catch(err){mdoStatus('Errore salvataggio: '+err.message,true);alert('Mezzo NON salvato: '+err.message+'\nSe il messaggio indica RLS, esegui prima la policy SQL fornita.') }}

calcoli=function(){let html=mdo9OldCalc();const block='<div class="panel"><h2>Archivio mezzi imprese</h2><p class="muted small">I mezzi censiti restano in Supabase e sono riutilizzabili. Ogni impresa ha il proprio elenco. Le verifiche normative restano quelle previste per la composizione selezionata.</p><div class="toolbar">'+mdo9FirmSelect('mdo9Company','Tutte le imprese')+'<select id="mdo9CompanyMezzo" class="field grow"></select><button class="btn primary" onclick="mdo9AddSaved()">Aggiungi al convoglio</button><button class="btn" onclick="mdo9AddCompany()">+ Censisci MdO</button></div></div>';html=html.replace('<div class="panel"><h2>2 · Percorso',block+'<div class="panel"><h2>2 · Percorso');setTimeout(()=>{let a=document.getElementById('mdo9Company');if(a&&!a.dataset.ready){a.dataset.ready='1';a.onchange=mdo9PickFirm;mdo9PickFirm()}},0);return html}

function mdo9EditExpiry(){if(mdoRole!=='admin')return alert('Le registrazioni delle verifiche RFI sono riservate all’amministratore');const list=db.mezzi.filter(m=>m.proprieta!=='IMPRESA'&&!m.archiviato);modal('<h2>Registra verifica MdO RFI</h2><p class="small muted">Registrare solo una verifica effettivamente completata; un ODL programmato non prova l’esecuzione.</p><form class="formgrid" onsubmit="mdo9SaveExpiry(event)"><label>Mezzo<select class="field" name="id" required>'+list.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.id+' · '+m.nome)+'</option>').join('')+'</select></label><label>Tipo<select class="field" name="tipo"><option value="annuale">Annuale MdO</option><option value="periodica">Periodica (33 mesi dal ciclo quinquennale)</option><option value="quinquennale">Quinquennale</option><option value="sollevamento">Sollevamento annuale (se applicabile)</option></select></label><label>Data effettiva<input class="field" required type="date" name="data"></label><label>Esito<select class="field" name="esito"><option value="POSITIVO">Positivo</option><option value="NEGATIVO">Negativo</option><option value="DA_VERIFICARE">Da verificare</option></select></label><label>Numero ODL / verbale<input class="field" name="odl"></label><label>Fonte (facoltativa)<input class="field" name="fonte" placeholder="Facoltativo"></label><div class="actions full"><button class="btn primary">Registra in Supabase</button></div></form>')}
async function mdo9SaveExpiry(e){e.preventDefault();const f=new FormData(e.target);const id=String(f.get('id'));const m=db.mezzi.find(x=>x.id===id);if(!m||m.proprieta==='IMPRESA')return alert('Seleziona un MdO RFI');const tipo=String(f.get('tipo')),data=String(f.get('data'));if(!data)return;const payload={mezzo_id:null,tipo:tipo,ultima_verifica:data,data_scadenza:tipo==='quinquennale'?addMonthsIso(data,60):tipo==='annuale'||tipo==='sollevamento'?addMonthsIso(data,12):null,esito:String(f.get('esito')),odl_sap:String(f.get('odl')||''),fonte:String(f.get('fonte')||''),note:'Verifica registrata da MDO Manager'};try{const rr=await mdoClient.from('mdo_mezzi').select('id').eq('codice_sap',id).single();if(rr.error)throw rr.error;payload.mezzo_id=rr.data.id;const ins=await mdoClient.from('mdo_scadenze').insert(payload);if(ins.error)throw ins.error;await mdo9LoadExpiries();closeModal();render();alert('Verifica registrata nell’archivio condiviso')}catch(err){alert('Salvataggio NON riuscito: '+err.message)}}
async function mdo9LoadExpiries(){if(!mdoSession)return;const {data,error}=await mdoClient.from('mdo_scadenze').select('mezzo_id,tipo,ultima_verifica,esito,fonte,created_at,updated_at').order('ultima_verifica',{ascending:false}).limit(1000);if(error)throw error;const ids=await mdoClient.from('mdo_mezzi').select('id,codice_sap').limit(1000);if(ids.error)throw ids.error;const map=new Map(ids.data.map(x=>[x.id,x.codice_sap]));for(const m of db.mezzi){if(m.proprieta==='IMPRESA')continue;const related=data.filter(r=>map.get(r.mezzo_id)===m.id&&r.esito==='POSITIVO');m.verifiche={...(m.verifiche||{})};for(const [type,key] of [['annuale','ultima_annuale'],['quinquennale','ultima_quinquennale'],['sollevamento','ultima_soll_acc']]){const rec=related.find(r=>r.tipo===type);if(rec&&(!m.verifiche[key]||rec.ultima_verifica>m.verifiche[key]))m.verifiche[key]=rec.ultima_verifica}if(related.some(r=>r.tipo==='sollevamento'))m.sollevamento_previsto=true}}

async function mdo10SaveRfi(e,id){
 e.preventDefault();if(!mdoSession||mdoRole!=='admin')return alert('Accesso amministratore necessario');
 const m=db.mezzi.find(x=>x.id===id&&x.proprieta!=='IMPRESA');if(!m)return;
 const f=new FormData(e.target),stato=String(f.get('stato'));
 const cause=String(f.get('causa')||'').trim();
 if(['OFF','FUES'].includes(stato)&&!cause)return alert('Indica il motivo del passaggio a '+stato);
 if(stato==='ESER'&&m.stato!=='ESER'&&!confirm('Confermi la registrazione dello stato ESER? Il gestionale non certifica il ripristino o l’idoneità del mezzo.'))return;
 const sol=String(f.get('sollevamento'));
 const dateKeys=['ultima_soll_acc','ultima_ponte_sviluppabile','ultima_gru'];
 const verify={...(m.verifiche||{})};for(const k of dateKeys)verify[k]=String(f.get(k)||'');
 const hasDates=dateKeys.some(k=>verify[k]);
 if(sol==='NO'&&hasDates&&!confirm('Hai indicato verifiche di sollevamento già registrate, ma selezionato “Non prevista”. Confermi?'))return;
 const data={...m,stato,causa,data_stato:String(f.get('data_stato')||''),sollevamento_previsto:sol==='SI'?true:sol==='NO'?false:undefined,verifiche:verify,fonte_sollevamento:String(f.get('fonte_sollevamento')||''),note_sollevamento:String(f.get('note_sollevamento')||''),dataAggiornamento:new Date().toISOString()};
 // Non modificare l'archivio locale finché il server non conferma.
 const btn=e.target.querySelector('button[type=submit],button:not([type])');if(btn)btn.disabled=true;

async function mdo10SaveRfi(e,id){
 e.preventDefault();if(!mdoSession||mdoRole!=='admin')return alert('Accesso amministratore necessario');
 const m=db.mezzi.find(x=>x.id===id&&x.proprieta!=='IMPRESA');if(!m)return;
 const f=new FormData(e.target),stato=String(f.get('stato')),causa=String(f.get('causa')||'').trim();
 
 if(stato==='ESER'&&m.stato!=='ESER'&&!confirm('Confermi lo stato ESER? Questa modifica non certifica idoneità o ripristino del mezzo.'))return;
 const apparecchiature={...(m.apparecchiature||{})},verifiche={...(m.verifiche||{})};
 for(const o of mdo11Equipment){
  const prev=apparecchiature[o.key]||{};
  const presente=f.get('presente_'+o.key)==='on';
  // Mantieni lo storico delle date anche quando un'attrezzatura viene deselezionata.
  const data=f.get('data_'+o.key)!==null?String(f.get('data_'+o.key)||''):(prev.ultima_verifica||verifiche[o.date]||'');
  const applicabile=String(f.get('applicabile_'+o.key)||prev.verifica_applicabile||'DA_VERIFICARE');
  const descrizione=String(f.get('descrizione_altro')||prev.descrizione||'').trim();
  const verbale=String(f.get('verbale_'+o.key)||prev.verbale||'').trim();
  const note=String(f.get('note_'+o.key)||prev.note||'').trim();
  // La data si registra senza conferme o riferimenti documentali.
  apparecchiature[o.key]={...prev,presente,verifica_applicabile:applicabile,ultima_verifica:data,verbale,note,...(o.key==='altro'?{descrizione}:{})};
  if(data)verifiche[o.date]=data;
 }
 let tecnica;
 try{tecnica=mdo33ParseForm(f,m.tecnica||{});}
 catch(err){return alert('Dati carta non validi: '+err.message)}
 // Le date dei controlli si registrano nella sezione verifiche, senza doppi campi.
 const dateMap={ultima_annuale:'data_ultima_annuale',ultima_periodica:'data_ultima_periodica',ultima_quinquennale:'data_ultima_quinquennale'};
 for(const [k,tk] of Object.entries(dateMap)){
  const val=String(f.get(k)||'');
  if(val)tecnica[tk]=val;
  else delete tecnica[tk];
 }
 // Costruttore e modello in intestazione sono gli stessi dell'anagrafica.
 tecnica.costruttore=String(f.get('costruttore')||'').trim();
 for(const key of ['ultima_annuale','ultima_periodica','ultima_quinquennale','ultima_soll_acc']){
  const date=String(f.get(key)||'');if(date)verifiche[key]=date;else delete verifiche[key];
 }
 const nome=String(f.get('nome')||'').trim();if(!nome)return alert('Inserisci la descrizione del mezzo');
 const presenti=mdo11Equipment.filter(o=>apparecchiature[o.key].presente);
 const prevista=presenti.some(o=>apparecchiature[o.key].verifica_applicabile==='SI');
 const data={...m,nome,matricola:String(f.get('matricola')||''),costruttore:String(f.get('costruttore')||''),modello:String(f.get('modello')||''),nucleo:String(f.get('nucleo')||''),libretto:String(f.get('libretto')||''),note:String(f.get('note')||''),tecnica,stato,causa,data_stato:String(f.get('data_stato')||''),apparecchiature,verifiche,sollevamento_previsto:prevista?true:presenti.length===0?false:undefined,dataAggiornamento:new Date().toISOString()};
 const btn=e.target.querySelector('button[type="submit"]');if(btn)btn.disabled=true;
 try{
  mdoStatus('Salvataggio scheda completa MdO…');
  const {error}=await mdoClient.from('mdo_mezzi').upsert(mdoRow(data),{onConflict:'codice_sap'});if(error)throw error;
  await mdoLoadRemote();closeModal();render();mdoStatus('Scheda MdO '+id+' aggiornata su Supabase');
 }catch(err){mdoStatus('Modifica NON salvata: '+err.message,true);alert('Modifica non salvata: '+err.message)}finally{if(btn)btn.disabled=false}
}

function mdo23TankChanged(){
 const f=document.querySelector('#modal form');if(!f)return;
 const id=f.querySelector('[name="cisterna_um"]')?.value;
 const input=f.querySelector('[name="conta_ini"]');
 if(!input)return;
 input.value='';input.placeholder='Recupero ultimo contalitri…';
 if(!id)return;
 // Read the latest refueling record for this exact tank, not the latest record overall.
 mdoClient.from('mdo_rifornimenti').select('contatore_finale,data_rifornimento,created_at').eq('cisterna_id',id).order('created_at',{ascending:false}).limit(1).then(({data,error})=>{
  if(!f.isConnected||f.querySelector('[name="cisterna_um"]')?.value!==id)return;
  if(error){input.placeholder='Imposta manualmente la lettura';return}
  const tank=mdo21Tanks.find(t=>t.id===id);
  const val=data?.length?data[0].contatore_finale:tank?.contalitri_base;
  input.value=val??'';
  input.placeholder=val==null?'Inserire lettura iniziale':'Ultima lettura disponibile';
 });
}

async function mdo31SaveCompany(e,id){
 e.preventDefault();if(mdoRole!=='admin')return alert('Solo amministratore');
 const m=db.mezzi.find(x=>x.id===id&&x.proprieta==='IMPRESA');
 if(!m)return alert('MdO impresa non trovato');

 const numerics=['numero_assi','massa_vuoto_t','carico_massimo_t','massa_frenata_vuoto_t','massa_frenata_carico_t','lunghezza_mm','velocita_composizione_kmh'];
 for(const k of numerics){
  const a=String(f.get(k)||'').trim();if(a==='')delete t[k];
  else if(!Number.isFinite(Number(a))||Number(a)<0)return alert('Valore non valido: '+k);
  else t[k]=Number(a);
 }
 for(const k of ['aggancio','frenatura'])t[k]=String(f.get(k)||'').trim();
 const firm=String(f.get('impresa')||'').trim(),name=String(f.get('nome')||'').trim();
 if(!firm||!name)return alert('Impresa e descrizione obbligatorie');

  modello:String(f.get('modello')||'').trim(),tecnica:t,

  if(error)throw error;if(!data?.length)throw Error('Supabase non ha aggiornato il mezzo: controlla i permessi');
  await mdoLoadRemote();closeModal();render();mdo15ShowGroup(firm);mdoStatus('MdO impresa aggiornato: '+id);
 }catch(err){alert('Modifica NON salvata: '+err.message)}
}

const mdo32Fmt=(v,dec=2)=>v==null?'—':Number(v).toLocaleString('it-IT',{maximumFractionDigits:dec});
function mdo32Init(d=window.compDraft){
 if(!d)return;

   field('categoria','Categoria di carico')+field('lunghezza','Lunghezza massima (m)','number')+field('note','Note e prescrizioni')+'</div></div>';
 }).join('');
 return items||'<p class="small muted">Nessun tratto aggiuntivo: utilizza i dati del percorso principale sopra.</p>';

function mdo32Voci(d){
 mdo32Init(d);
 return d.ids.map((id,i)=>{
  const m=(d.temporanei||[]).find(x=>x.id===id)||db.mezzi.find(x=>x.id===id);
  const t=m?.tecnica||{},v=d.voci[i];
  const tare=mdo32N(t.massa_vuoto_t??m?.massa);
  const load=mdo32N(v.carico_t);
  const mass=tare!==null&&tare>0&&load!==null&&load>=0?tare+load:null;
  const brake=v.freno_inserito===false?0:mdo32N(v.massa_frenata_t);
  const length=mdo32N(t.lunghezza_mm);
  const speed=mdo32N(v.limite_kmh)||mdo32N(t.velocita_composizione_kmh);
  const nAx=mdo32N(t.numero_assi);
  return {id,i,m,v,t,tare,load,mass,brake,length,speed,nAx,
   axleAvg:mass!==null&&nAx>0?mass/nAx:null};
 });
}
function mdo32Totals(d){
 const a=mdo32Voci(d),valid=(field)=>a.length>0&&a.every(x=>x[field]!==null&&x[field]!==undefined);
 const totalMass=valid('mass')?a.reduce((n,x)=>n+x.mass,0):null;
 const brakeMass=valid('brake')?a.reduce((n,x)=>n+x.brake,0):null;
 const length=valid('length')?a.reduce((n,x)=>n+x.length,0):null;
 const ratio=totalMass>0&&brakeMass!==null?100*brakeMass/totalMass:null;
 const hauled=a.length&&a.every(x=>x.mass!==null)?a.filter(x=>x.v.ruolo!=='MOTRICE').reduce((n,x)=>n+x.mass,0):null;
 const lim=a.map(x=>x.speed).filter(x=>x!==null);
 const segments=Array.isArray(d.segmenti)?d.segmenti:[];
 const segSpeeds=segments.map(x=>mdo32N(x.velocita)).filter(x=>x!==null);
 const classic=mdo32N(d.velocitaLinea);
 const allSeg=segments.length&&segments.every(x=>x.da&&x.a&&x.fl);
 const minSpeed=lim.length===a.length&&a.length>0&&(segSpeeds.length===segments.length||!segments.length)?Math.min(...lim,...segSpeeds,...(classic!==null?[classic]:[])):null;
 const slopes=segments.map(x=>mdo32N(x.pendenza)).filter(x=>x!==null);
 const maxSlope=segments.length?(slopes.length===segments.length?Math.max(...slopes):null):mdo32N(d.pendenza);
 const lenLimits=[mdo32N(d.lunghezzaLimite),...segments.map(x=>mdo32N(x.lunghezza))].filter(x=>x!==null);
 const minLengthLimit=lenLimits.length?Math.min(...lenLimits):null;
 const exceedsLength=length!==null&&minLengthLimit!==null&&length/1000>minLengthLimit;
 return {a,totalMass,brakeMass,length,ratio,hauled,minSpeed,maxSlope,minLengthLimit,exceedsLength,allSeg};
}

function mdo33Input(k,label,type,options,value){
 let v=value??'';
 if(type==='select')return '<label>'+esc(label)+'<select class="field" name="card_'+k+'"><option value="">Non indicato</option>'+options.map(x=>'<option value="'+x+'" '+(x===v?'selected':'')+'>'+esc(x.replaceAll('_',' '))+'</option>').join('')+'</select></label>';
 if(type==='textarea')return '<label class="full">'+esc(label)+'<textarea class="field" name="card_'+k+'" rows="3">'+esc(v)+'</textarea></label>';
 return '<label>'+esc(label)+'<input class="field" name="card_'+k+'" type="'+(type==='number'?'number':'text')+'" '+(type==='number'?'step="any" min="0" ':'')+'value="'+esc(v)+'"></label>';
}
function mdo33Fields(t={}){
 return '<div class="full"><h3>Caratteristiche e prescrizioni dalla carta di circolazione</h3><p class="small muted">Riporta soltanto quanto indicato nella carta del singolo mezzo. Le voci a scelta limitata usano menu; i valori quantitativi sono modificabili.</p></div>'+
 mdo33Specs.map(([k,label,type,options])=>mdo33Input(k,label,type,options||[],t[k])).join('');
}
function mdo33ParseForm(f,original={}){
 const t={...original};
 for(const [k,label,type] of mdo33Specs){
  const raw=f.get('card_'+k);if(raw===null)continue;
  const v=String(raw).trim();
  if(!v){delete t[k];continue}
  if(type==='number'){
   const n=Number(v);
   if(!Number.isFinite(n)||n<0)throw Error('Valore non valido per '+label);
   if(k==='numero_assi'&&(!Number.isInteger(n)||n===0))throw Error('Numero assi: inserire un intero positivo');
   if(k==='limite_pezzi_carta'&&(!Number.isInteger(n)||n===0))throw Error('Limite rotabili: inserire un intero positivo');
   t[k]=n;
  }else t[k]=v;
 }
 return t;
}

// tramite la scheda specifica, senza duplicare valori tecnici discordanti.
function mdo33TechnicalSpeed(m,role){
 const t=m?.tecnica||{};
 const nums=arr=>arr.map(k=>mdo32N(t[k])).filter(x=>x!==null&&x>0);
 const isolated=nums(['velocita_isolato_kmh','velocita_trazione_attiva_kmh']);
 const pulling=nums(['velocita_trazione_attiva_kmh','velocita_composizione_kmh']);
 const towed=nums(['velocita_trainato_kmh','velocita_composizione_kmh']);
 const arr=role==='MOTRICE'?(mdo32N(t.velocita_isolato_kmh)&&window.compDraft?.ids?.length===1?isolated:pulling):towed;
 return arr.length?Math.min(...arr):null;
}
function mdo33BrakeMass(m,load,role,frenoAttivo=true){
 if(!frenoAttivo)return 0;
 const t=m?.tecnica||{};
 // Non interpolare valori di frenatura non dichiarati dalla carta.
 if(mdo32N(load)===null)return null;
 const key=Number(load)>0?'massa_frenata_carico_t':'massa_frenata_vuoto_t';
 return mdo32N(t[key]);
}
function mdo33Unification(m){
 const t=m?.tecnica||{};
 const raw=String(t.aggancio_unificato||t.aggancio||'').toUpperCase();
 if(raw.includes('NON_UNIFICAT')||raw.includes('NON UNIFICAT'))return 'NON_UNIFICATI';
 if(raw==='UIC'||raw==='FS'||raw.includes('UNIFICAT')&&!raw.includes('NON'))return 'UNIFICATI';
 return 'NON_INDICATO';
}
function mdo33SixCheck(d){
 const selected=d.ids.map(compMezzo).filter(Boolean),non=selected.filter(m=>mdo33Unification(m)==='NON_UNIFICATI');
 if(!non.length)return {status:'NON_APPLICABILE',msg:'Nessun mezzo è marcato come non unificato.',count:selected.length};
 if(selected.length<=6)return {status:'ENTRO_LIMITE',msg:selected.length+' rotabili complessivi; limite ordinario ICMO art.3/B: 6.',count:selected.length};
 const overrides=non.map(m=>({id:m.id,limit:mdo32N(m.tecnica?.limite_pezzi_carta),source:m.tecnica?.fonte_carta||m.tecnica?.numero_carta}));
 if(overrides.length&&overrides.every(x=>x.limit!==null&&x.limit>=selected.length&&x.source)){
  return {status:'DEROGA_DA_CARTA',msg:'Oltre 6 rotabili: limitazione specifica riportata nelle carte dei MdO non unificati. Verificare applicabilità di ogni prescrizione.',count:selected.length};
 }
 return {status:'BLOCCANTE',msg:'Composizione di '+selected.length+' rotabili con organi non unificati: massimo ordinario di 6, compresi i mezzi di trazione, salvo diversa disposizione delle carte (ICMO art.3/B).',count:selected.length};
}


// Applicazione automatica dei dati di frenatura e velocità estratti dalla scheda MdO.
const mdo33OriginalVoci=mdo32Voci;
mdo32Voci=function(d){
 const rows=mdo33OriginalVoci(d);
 return rows.map(x=>{
  const cardBrake=mdo33BrakeMass(x.m,x.load,x.v.ruolo,x.v.freno_inserito!==false);
  const cardSpeed=mdo33TechnicalSpeed(x.m,x.v.ruolo);
  const localLimit=mdo32N(x.v.limite_kmh);
  const appliedSpeed=cardSpeed===null?null:localLimit===null?cardSpeed:Math.min(cardSpeed,localLimit);
  return {...x,brake:cardBrake,speed:appliedSpeed,cardBrake,cardSpeed};
 });
};

// Per i rami deviati si applica la prescrizione soltanto quando il percorso
// comprende un ramo deviato. Il confronto usa il minimo tra i limiti riportati.
function mdo33EffectiveSpeed(d){
 const t=mdo32Totals(d);let limit=t.minSpeed;
 const diverted=(d.segmenti||[]).some(x=>x.ramo_deviato===true)||d.ramo_deviato===true;
 if(diverted){
  const v=t.a.map(x=>mdo32N(x.m?.tecnica?.velocita_deviata_kmh)).filter(x=>x!==null&&x>0);
  if(v.length===t.a.length&&v.length)limit=limit===null?Math.min(...v):Math.min(limit,...v);
  else return {limit,missingDeviata:true};
 }
 return {limit,missingDeviata:false};
}
const mdo33OldTotal=mdo32Totals;
mdo32Totals=function(d){
 const t=mdo33OldTotal(d);
 const diversion=(d.segmenti||[]).some(x=>x.ramo_deviato===true)||d.ramo_deviato===true;
 if(diversion){
  const x=t.a.map(v=>mdo32N(v.m?.tecnica?.velocita_deviata_kmh)).filter(v=>v!==null&&v>0);
  if(x.length&&t.minSpeed!==null)t.minSpeed=Math.min(t.minSpeed,...x);
  // Un limite rami deviati mancante non equivale a una nuova limitazione a zero:
  // resta il limite normale da carta, salvo altre prescrizioni in testo.
 }
 return t;
};
