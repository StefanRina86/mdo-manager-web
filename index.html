const mdo35OriginalCardInput=mdo33Input;
mdo33Input=function(k,label,type,options,value){
 if(type==='select'&&value!==undefined&&value!==null&&String(value)!==''&&!options.includes(String(value))){
  const raw=String(value);
  return '<label>'+esc(label)+'<select class="field" name="card_'+k+'"><option value="">Non indicato</option>'+
   '<option value="'+esc(raw)+'" selected>Valore SAP / carta: '+esc(raw)+'</option>'+
   options.map(x=>'<option value="'+esc(x)+'">'+esc(x.replaceAll('_',' '))+'</option>').join('')+'</select></label>';
 }
 return mdo35OriginalCardInput(k,label,type,options,value);
};
const mdo34OldInput=mdo33Input;
mdo33Input=function(k,label,type,options,value){
 if(type==='date')return '<label>'+esc(label)+'<input class="field" type="date" name="card_'+k+'" value="'+esc(value||'')+'"></label>';
 return mdo34OldInput(k,label,type,options,value);
};
const mdo34OldParse=mdo33ParseForm;
mdo33ParseForm=function(form,original={}){
 const result=mdo34OldParse(form,original);
 for(const section of ['manutenzioni_officina','controlli_periodici','variazioni_proprietario','variazioni_utilizzatore']){
  const raw=form.get('card_'+section);
  if(raw===null)continue;
  let arr;
  try{arr=JSON.parse(String(raw))}catch(err){throw Error('Registro '+section+': impossibile leggere le righe')}
  if(!Array.isArray(arr))throw Error('Registro '+section+': formato non valido');
  for(const row of arr){
   if(typeof row!=='object'||!row||Array.isArray(row))throw Error('Riga non valida in '+section);
   if(row.data&&!/^\d{4}-\d{2}-\d{2}$/.test(row.data))throw Error('Data non valida nel registro '+section);
  }
  result[section]=arr;
 }
 // Allinea la tipologia organi al dato usato dal controllo ICMO sui 6 rotabili.
 if(result.tipologia_organi_aggancio){
   const map={UNIFICATI_FS:'FS',UNIFICATI_UIC:'UIC',NON_UNIFICATI:'NON_UNIFICATI',SPECIALI:'SPECIALI'};
   result.aggancio_unificato=map[result.tipologia_organi_aggancio]||result.aggancio_unificato;
 }
 if(result.freno_continuo_tipo==='UNIFICATO')result.freno_continuo='SI';
 if(result.freno_continuo_tipo==='ASSENTE')result.freno_continuo='NO';
 return result;
};
function mdo34HistoryTable(name,label,rows){
 const safe=Array.isArray(rows)?rows:[];
 const value=esc(JSON.stringify(safe));
 const cols=name.startsWith('variazioni')?
  [['data','Data','date'],['soggetto','Ragione sociale','text'],['indirizzo','Indirizzo','text']]:
  [['data','Data','date'],['riferimento','Verbale / ODL / officina','text'],['esito','Esito / descrizione','text'],['note','Note','text']];
 const makeRow=(obj,i)=>'<div class="item mdo34-histrow" data-history="'+name+'" data-index="'+i+'" style="margin:5px 0">'+
  '<div class="formgrid">'+cols.map(([key,title,type])=>'<label>'+title+'<input class="field" type="'+type+'" data-key="'+key+'" value="'+esc(obj?.[key]||'')+'" oninput="mdo34SyncHistory(\''+name+'\')"></label>').join('')+
  '</div><button class="btn" type="button" onclick="mdo34RemoveHistory(\''+name+'\','+i+')">Rimuovi riga</button></div>';
 return '<section class="full mdo34-section"><h3>'+esc(label)+'</h3>'+
  '<p class="small muted">Registra le date riportate nei fogli 2 e 3 della carta. La semplice presenza di una data non certifica l’esito di una verifica.</p>'+
  '<div id="mdo34Rows_'+name+'">'+safe.map(makeRow).join('')+'</div>'+
  '<input type="hidden" name="card_'+name+'" id="mdo34JSON_'+name+'" value="'+value+'">'+
  '<button type="button" class="btn" onclick="mdo34AddHistory(\''+name+'\')">+ Aggiungi registrazione</button></section>';
}
function mdo34RowHTML(name,entry={},i){
 const cols=name.startsWith('variazioni')?
 [['data','Data','date'],['soggetto','Ragione sociale','text'],['indirizzo','Indirizzo','text']]:
 [['data','Data','date'],['riferimento','Verbale / ODL / officina','text'],['esito','Esito / descrizione','text'],['note','Note','text']];
 return '<div class="item mdo34-histrow" data-history="'+name+'" data-index="'+i+'" style="margin:5px 0">'+
 '<div class="formgrid">'+cols.map(([k,l,type])=>'<label>'+l+'<input class="field" type="'+type+'" data-key="'+k+'" value="'+esc(entry[k]||'')+'" oninput="mdo34SyncHistory(\''+name+'\')"></label>').join('')+'</div>'+
 '<button class="btn" type="button" onclick="mdo34RemoveHistory(\''+name+'\','+i+')">Rimuovi riga</button></div>';
}
function mdo34SyncHistory(name){
 const root=document.getElementById('mdo34Rows_'+name),hidden=document.getElementById('mdo34JSON_'+name);
 if(!root||!hidden)return;
 const rows=[...root.querySelectorAll('.mdo34-histrow')].map(el=>{
  const obj={};for(const inp of el.querySelectorAll('[data-key]'))obj[inp.dataset.key]=inp.value.trim();
  return obj;
 }).filter(obj=>Object.values(obj).some(v=>v!==''));
 hidden.value=JSON.stringify(rows);
}
function mdo34AddHistory(name){
 const root=document.getElementById('mdo34Rows_'+name);if(!root)return;
 root.insertAdjacentHTML('beforeend',mdo34RowHTML(name,{},root.children.length));mdo34SyncHistory(name);
}
function mdo34RemoveHistory(name,i){
 const root=document.getElementById('mdo34Rows_'+name);if(!root)return;
 root.children[i]?.remove();mdo34SyncHistory(name);
}

const mdo34OldRenderComp=renderCompResult;
renderCompResult=function(d){
 let out=mdo34OldRenderComp(d);
 const issues=[];
 for(const id of d?.ids||[]){
  const m=compMezzo(id);if(!m)continue;
  const t=m.tecnica||{};
  if(t.ammesso_composizione==='NO')issues.push(id+': carta indica NON AMMESSO in composizione');
  if(t.necessita_coda_assoluta==='SI'&&d.ids.indexOf(id)!==d.ids.length-1)issues.push(id+': deve occupare la coda assoluta');
  if(t.necessita_carro_scudo==='SI')issues.push(id+': necessità di carro scudo riportata nella carta');
  if(t.rispetta_profilo_limite==='NO')issues.push(id+': non rispetta il profilo limite');
  if(t.occupazione_cdb==='NO')issues.push(id+': non occupa i circuiti di binario');
  if(t.limiti_circolazione)issues.push(id+': prescrizioni da carta — '+t.limiti_circolazione);
  if(t.prescrizioni_sagoma&&String(t.prescrizioni_sagoma).toUpperCase()!=='NESSUNA')issues.push(id+': prescrizioni sagoma — '+t.prescrizioni_sagoma);
 }
 return (issues.length?'<div class="note warn"><b>Prescrizioni risultanti dalle carte</b><ul>'+issues.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'')+out;
};
